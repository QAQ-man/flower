<!DOCTYPE html>
<html class="w-full h-full" lang="zh-CN">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1" name="viewport"/>
    <title>会员订阅 · 花加 FLOWERPLUS</title>
   <script src="https://cdn.tailwindcss.com"></script>
   <script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
   <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <style>
        .serif { font-family: "Songti SC", "Noto Serif SC", Georgia, serif; }
        body { background-color: #faf9f6; }
        ::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="w-full min-h-screen text-gray-800 antialiased overflow-x-hidden">

    <!-- 顶部导航栏 -->
    <header class="sticky top-0 z-50 bg-white/90 backdrop-blur-md shadow-sm border-b border-gray-100">
        <div class="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between">
            <!-- Logo -->
            <a href="shop.html" class="flex items-center gap-2">
                <span class="w-8 h-8 rounded-full bg-rose-500 flex items-center justify-center text-white">
                    <iconify-icon class="text-[18px]" icon="solar:flower-2-bold"></iconify-icon>
                </span>
                <span class="serif text-xl font-bold tracking-widest text-gray-900">FLOWERPLUS</span>
            </a>
            
            <!-- 中间导航 -->
            <nav class="hidden md:flex items-center gap-8 text-sm font-medium text-gray-600">
                <a href="shop.html" class="hover:text-rose-500 transition">首页</a>
                <a href="subscribe.html" class="text-rose-500">会员订阅</a>
                <a href="gifts.html" class="hover:text-rose-500 transition">节日礼盒</a>
                <a href="about.html" class="hover:text-rose-500 transition">关于我们</a>
            </nav>

            <!-- 右侧操作区 -->
            <div class="flex items-center gap-5">
                
                <!-- 购物车 -->
                <button onclick="toggleCart()" class="text-gray-600 hover:text-rose-500 transition relative">
                    <iconify-icon class="text-[22px]" icon="solar:cart-large-2-linear"></iconify-icon>
                    <span id="cartBadge" class="absolute -top-1 -right-1 w-4 h-4 bg-rose-500 text-white text-[10px] flex items-center justify-center rounded-full hidden">0</span>
                </button>

                <!-- 用户头像 & 点击下拉菜单【修复版，和shop.html统一】 -->
                <div class="relative" id="userWrap">
                    <button id="userBtn" class="text-gray-600 hover:text-rose-500 transition flex items-center">
                        <iconify-icon class="text-[22px]" icon="solar:user-circle-linear"></iconify-icon>
                    </button>
                    <div id="userMenu" class="hidden absolute right-0 mt-1 w-48 bg-white rounded-2xl shadow-xl border border-gray-100 transition-all duration-200 z-50">
                        <div class="absolute -top-2 right-3 w-4 h-4 bg-white border-t border-l border-gray-100 transform rotate-45"></div>
                        <div class="py-2 relative bg-white rounded-2xl">
							<a href="profile.html" class="flex items-center gap-3 px-4 py-2.5 text-sm text-gray-600 hover:bg-rose-50 hover:text-rose-600 transition">
                                <iconify-icon class="text-[18px]" icon="solar:user-id-linear"></iconify-icon> 个人中心
                            </a>
                            <a href="my-orders.html" class="flex items-center gap-3 px-4 py-2.5 text-sm text-gray-600 hover:bg-rose-50 hover:text-rose-600 transition">
                                <iconify-icon class="text-[18px]" icon="solar:bill-list-linear"></iconify-icon>
                                我的订单
                            </a>
                            <div onclick="logoutUser()" class="flex items-center gap-3 px-4 py-2.5 text-sm text-gray-600 hover:bg-rose-50 hover:text-rose-600 transition cursor-pointer">
                                <iconify-icon class="text-[18px]" icon="solar:logout-3-linear"></iconify-icon>
                                退出登录
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <!-- 订阅介绍 -->
    <section class="max-w-6xl mx-auto px-4 py-16 text-center">
        <h1 class="serif text-4xl font-bold text-gray-900 mb-4">升级会员，把春天带回家</h1>
        <p class="text-gray-500">加入会员俱乐部，享受专属鲜花折扣与优先配送特权。</p>
    </section>

    <!-- 套餐列表 -->
    <section class="max-w-6xl mx-auto px-4 pb-20">
        <div class="grid grid-cols-1 md:grid-cols-3 gap-8" id="planContainer">
            <!-- JS 渲染 -->
        </div>
    </section>

    <!-- ⭐ 核心补全：扫码支付弹窗 -->
    <div id="payModal" class="fixed inset-0 z-[120] hidden items-center justify-center bg-black/60 backdrop-blur-sm transition-opacity">
        <div class="bg-white rounded-2xl shadow-2xl w-[350px] overflow-hidden text-center p-6 relative">
            <div class="flex justify-between items-center mb-4 border-b border-gray-100 pb-3">
                <span class="text-gray-900 font-bold text-lg">微信支付</span>
                <button onclick="closePayModal()" class="text-gray-400 hover:text-gray-800">
                    <iconify-icon class="text-[20px]" icon="solar:close-circle-linear"></iconify-icon>
                </button>
            </div>
            
            <p class="text-gray-500 text-sm">支付金额</p>
            <p class="text-3xl font-bold text-gray-900 mb-6"><span class="text-lg">￥</span><span id="payAmount">0.00</span></p>
            
            <div class="w-48 h-48 mx-auto bg-gray-50 border border-gray-100 rounded-xl flex items-center justify-center relative overflow-hidden group">
                <img id="payQrCode" src="" alt="二维码" class="w-40 h-40 object-contain" />
                <div id="paySuccessMask" class="absolute inset-0 bg-white/90 backdrop-blur flex flex-col items-center justify-center hidden">
                    <iconify-icon class="text-[50px] text-green-500 mb-2" icon="solar:check-circle-bold"></iconify-icon>
                    <p class="text-green-600 font-bold">支付成功</p>
                </div>
            </div>
            
            <p class="mt-6 text-xs text-gray-400 flex items-center justify-center gap-1">
                <iconify-icon icon="solar:smartphone-linear"></iconify-icon> 请使用微信扫一扫完成支付
            </p>
            
            <button onclick="mockScanSuccess()" class="mt-6 w-full py-2 bg-emerald-50 text-emerald-600 rounded-lg text-sm border border-emerald-200 hover:bg-emerald-100 transition">
                模拟手机扫码成功 (演示用)
            </button>
        </div>
    </div>

    <!-- 登录弹窗 和 shop.html保持一致 -->
    <div id="loginModal" class="fixed inset-0 z-[100] hidden items-center justify-center bg-black/40 backdrop-blur-sm transition-opacity">
        <div class="bg-white rounded-3xl shadow-2xl w-[400px] overflow-hidden transform scale-95 opacity-0 transition-all duration-300" id="loginModalContent">
            <div class="relative h-32 bg-gradient-to-r from-rose-400 to-rose-300 flex items-center justify-center">
                <h2 class="serif text-2xl font-bold text-white tracking-widest">WELCOME BACK</h2>
                <button onclick="closeLoginModal()" class="absolute top-4 right-4 text-white/70 hover:text-white transition">
                    <iconify-icon class="text-[24px]" icon="solar:close-circle-linear"></iconify-icon>
                </button>
            </div>
            <div class="p-8">
                <div class="flex justify-center gap-8 mb-8 border-b border-gray-100 pb-2">
                    <button id="tabLogin" onclick="switchTab('login')" class="text-lg font-bold text-gray-900 border-b-2 border-rose-500 pb-2">登录</button>
                    <button id="tabRegister" onclick="switchTab('register')" class="text-lg font-medium text-gray-400 pb-2 hover:text-gray-600 transition">注册</button>
                </div>

                <form id="formLogin" onsubmit="handleLogin(event)">
                    <div class="space-y-4">
                        <div class="relative">
                            <iconify-icon class="absolute left-4 top-1/2 -translate-y-1/2 text-gray-400 text-[20px]" icon="solar:user-linear"></iconify-icon>
                            <input id="loginPhone" type="text" placeholder="请输入手机号" class="w-full h-12 pl-12 pr-4 bg-gray-50 border border-gray-100 rounded-xl outline-none focus:border-rose-300 focus:bg-white transition" required />
                        </div>
                        <div class="relative">
                            <iconify-icon class="absolute left-4 top-1/2 -translate-y-1/2 text-gray-400 text-[20px]" icon="solar:lock-password-linear"></iconify-icon>
                            <input id="loginPassword" type="password" placeholder="请输入密码" class="w-full h-12 pl-12 pr-4 bg-gray-50 border border-gray-100 rounded-xl outline-none focus:border-rose-300 focus:bg-white transition" required />
                        </div>
                    </div>
                    <div class="flex justify-between items-center mt-4 mb-6">
                        <label class="flex items-center gap-2 text-sm text-gray-500 cursor-pointer">
                            <input type="checkbox" class="accent-rose-500" checked> 记住我
                        </label>
                        <a href="#" class="text-sm text-rose-500 hover:underline">忘记密码？</a>
                    </div>
                    <button type="submit" class="w-full h-12 bg-rose-500 text-white rounded-xl font-bold hover:bg-rose-600 transition shadow-lg shadow-rose-500/30">
                        立即登录
                    </button>
                </form>

                <form id="formRegister" class="hidden" onsubmit="handleRegister(event)">
                    <div class="space-y-4">
                        <div class="relative">
                            <iconify-icon class="absolute left-4 top-1/2 -translate-y-1/2 text-gray-400 text-[20px]" icon="solar:user-linear"></iconify-icon>
                            <input id="regName" type="text" placeholder="设置昵称" class="w-full h-12 pl-12 pr-4 bg-gray-50 border border-gray-100 rounded-xl outline-none focus:border-rose-300 focus:bg-white transition" required />
                        </div>
                        <div class="relative">
                            <iconify-icon class="absolute left-4 top-1/2 -translate-y-1/2 text-gray-400 text-[20px]" icon="solar:phone-linear"></iconify-icon>
                            <input id="regPhone" type="text" placeholder="请输入手机号" class="w-full h-12 pl-12 pr-4 bg-gray-50 border border-gray-100 rounded-xl outline-none focus:border-rose-300 focus:bg-white transition" required />
                        </div>
                        <div class="relative">
                            <iconify-icon class="absolute left-4 top-1/2 -translate-y-1/2 text-gray-400 text-[20px]" icon="solar:lock-password-linear"></iconify-icon>
                            <input id="regPassword" type="password" placeholder="设置密码" class="w-full h-12 pl-12 pr-4 bg-gray-50 border border-gray-100 rounded-xl outline-none focus:border-rose-300 focus:bg-white transition" required />
                        </div>
                    </div>
                    <button type="submit" class="w-full h-12 bg-gray-900 text-white rounded-xl font-bold hover:bg-gray-800 transition mt-6 shadow-lg shadow-gray-900/30">
                        注册并登录
                    </button>
                </form>
            </div>
        </div>
    </div>

    <div id="toast" class="fixed top-20 left-1/2 -translate-x-1/2 bg-gray-900 text-white px-6 py-3 rounded-full text-sm shadow-2xl z-50 transform -translate-y-10 opacity-0 transition-all duration-300 pointer-events-none">
        提示
    </div>

    <script>
        // 全局变量
        let pendingSubscribeLevel = null; // 暂存要升级的等级
        let subscribeAmount = 0;          // 暂存要支付的金额
        let subscribeOrderNo = '';        // 暂存生成的订单号
        let pollingTimer = null;
        let cart = JSON.parse(localStorage.getItem('shopCart') || '[]');

        document.addEventListener('DOMContentLoaded', () => {
            renderPlans();
            updateUserAvatar();
            updateCartUI();
        });

        // 购物车侧边栏（和shop.html统一）
        function toggleCart() {
            window.location.href = 'shop.html';
        }
        function updateCartUI() {
            const badge = document.getElementById('cartBadge');
            const totalQty = cart.reduce((sum, item) => sum + item.qty, 0);
            if (totalQty > 0) {
                badge.classList.remove('hidden');
                badge.textContent = totalQty;
            } else {
                badge.classList.add('hidden');
            }
        }

        // ⭐ 更新右上角头像【和shop.html完全一致逻辑】
        function updateUserAvatar() {
            const userStr = localStorage.getItem('shopUser');
            const userBtn = document.getElementById('userBtn');
            const userMenu = document.getElementById('userMenu');
            
            if (userStr && userBtn) {
                const user = JSON.parse(userStr);
                if (user.avatar && user.avatar.trim() !== '') {
                    userBtn.innerHTML = `
                        <img src="${user.avatar}" alt="头像" class="w-8 h-8 rounded-full object-cover border border-gray-200"/>
                    `;
                } else {
                    userBtn.innerHTML = `
                        <div class="w-8 h-8 rounded-full bg-rose-500 text-white flex items-center justify-center text-sm font-bold">
                            ${user.memberName ? user.memberName.charAt(0).toUpperCase() : '花'}
                        </div>
                    `;
                }
                // 已登录：点击切换下拉菜单
                userBtn.onclick = function(e) {
                    e.stopPropagation();
                    userMenu.classList.toggle('hidden');
                };
            } else if (userBtn) {
                // 未登录：点击弹出登录弹窗
                userBtn.innerHTML = `<iconify-icon class="text-[22px]" icon="solar:user-circle-linear"></iconify-icon>`;
                userBtn.onclick = function() {
                    openLoginModal();
                };
            }
        }

        // ⭐ 渲染套餐
        function renderPlans() {
            const plans = [
                {
                    id: 1, name: '初见 · 普通会员', desc: '适合初次尝试的你', price: 99, unit: '/ 月',
                    features: ['每月 1 束精选鲜花', '基础花材搭配', '顺丰冷链配送'], level: '普通会员', isHot: false
                },
                {
                    id: 2, name: '繁花 · 金卡会员', desc: '每周一束，点亮生活', price: 299, unit: '/ 月',
                    features: ['每月 4 束主题鲜花', '高阶进口花材混搭', '专属花艺师定制', '赠送精美花瓶'], level: '金卡会员', isHot: true
                },
                {
                    id: 3, name: '包季 · 铂金会员', desc: '送礼自用皆宜', price: 799, unit: '/ 季',
                    features: ['连续 3 个月配送', '每周 1 束精选鲜花', '节假日优先发货'], level: '铂金会员', isHot: false
                }
            ];

            const container = document.getElementById('planContainer');
            container.innerHTML = plans.map(p => {
                const bgClass = p.isHot ? 'bg-gray-900 text-white' : 'bg-white text-gray-900 border border-gray-100';
                const btnClass = p.isHot ? 'bg-rose-500 text-white hover:bg-rose-600 shadow-lg shadow-rose-500/30' : 'border border-rose-500 text-rose-500 hover:bg-rose-500 hover:text-white';
                const descClass = p.isHot ? 'text-gray-400' : 'text-gray-400';
                
                return `
                    <div class="${bgClass} rounded-3xl p-8 shadow-sm hover:shadow-xl transition-all duration-300 relative overflow-hidden group">
                        ${p.isHot ? '<div class="absolute top-0 right-0 w-24 h-24 bg-rose-500/10 rounded-bl-full -z-10"></div>' : ''}
                        ${p.isHot ? '<div class="absolute top-4 right-4 bg-rose-500 text-white text-xs px-3 py-1 rounded-full">最受欢迎</div>' : ''}
                        
                        <h2 class="text-xl font-bold mb-2">${p.name}</h2>
                        <p class="text-sm ${descClass} mb-6">${p.desc}</p>
                        
                        <div class="text-3xl font-bold ${p.isHot ? 'text-rose-400' : 'text-rose-500'} mb-6">
                            <span class="text-lg">￥</span>${p.price} <span class="text-sm font-normal ${descClass}">${p.unit}</span>
                        </div>
                        
                        <ul class="space-y-3 text-sm mb-8 ${p.isHot ? 'text-gray-300' : 'text-gray-600'}">
                            ${p.features.map(f => `
                                <li class="flex items-center gap-2">
                                    <iconify-icon class="${p.isHot ? 'text-rose-400' : 'text-rose-500'}" icon="solar:check-circle-bold"></iconify-icon> 
                                    ${f}
                                </li>
                            `).join('')}
                        </ul>
                        
                        <button onclick="openSubscribePay('${p.level}', ${p.price})" class="w-full py-3 rounded-xl font-medium transition ${btnClass}">
                            立即订阅
                        </button>
                    </div>
                `;
            }).join('');
        }

        // ⭐ 第一步：点击立即订阅，弹出扫码支付
        function openSubscribePay(level, price) {
            const userStr = localStorage.getItem('shopUser');
            if (!userStr) {
                showToast("请先登录！");
                openLoginModal();
                return;
            }

            const user = JSON.parse(userStr);
            pendingSubscribeLevel = level;
            subscribeAmount = price;
            subscribeOrderNo = 'VIP' + Date.now();

            const modal = document.getElementById('payModal');
            document.getElementById('payAmount').textContent = price.toFixed(2);
            
            const myLocalIP = "10.249.127.39"; 
            const port = "8890"; 
            const qrContent = `http://${myLocalIP}:${port}/flower/m_confirm.html?orderNo=${subscribeOrderNo}&amount=${price}`;
            
            document.getElementById('payQrCode').src = `https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encodeURIComponent(qrContent)}`;
            document.getElementById('paySuccessMask').classList.add('hidden');
            
            modal.classList.remove('hidden');
            modal.classList.add('flex');

            clearInterval(pollingTimer);
            pollingTimer = setInterval(async () => {
                try {
                    const res = await fetch(`https://api.zhuys.dpdns.org/api/orders/checkPay/${subscribeOrderNo}`);
                    const result = await res.json();
                    
                    if (result.code === 200 && result.data === true) {
                        clearInterval(pollingTimer); 
                        document.getElementById('paySuccessMask').classList.remove('hidden'); 
                        
                        setTimeout(() => {
                            closePayModal();
                            submitSubscribe(user.id, level);
                        }, 1000);
                    }
                } catch (e) {
                    console.error("查询状态失败", e);
                }
            }, 1500); 
        }

        // ⭐ 关闭支付弹窗
        function closePayModal() {
            const modal = document.getElementById('payModal');
            modal.classList.add('hidden');
            modal.classList.remove('flex');
            clearInterval(pollingTimer); 
        }

        // ⭐ 模拟扫码成功
        function mockScanSuccess() {
            document.getElementById('paySuccessMask').classList.remove('hidden');
            setTimeout(() => {
                closePayModal();
                const user = JSON.parse(localStorage.getItem('shopUser'));
                submitSubscribe(user.id, pendingSubscribeLevel);
            }, 1000);
        }

        // ⭐ 升级会员逻辑
        async function submitSubscribe(memberId, targetLevel) {
            try {
                const res = await fetch(`https://api.zhuys.dpdns.org/api/members/upgrade`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ memberId: memberId, newLevel: targetLevel })
                });
                const result = await res.json();

                if (result.code === 200) {
                    showToast(`恭喜您，已成功升级为【${targetLevel}】！`);
                    
                    const user = JSON.parse(localStorage.getItem('shopUser'));
                    user.memberLevel = targetLevel;
                    localStorage.setItem('shopUser', JSON.stringify(user));
                    
                    if (targetLevel === '普通会员') {
                        window.location.href = 'vip-normal.html';
                    } else if (targetLevel === '金卡会员') {
                        window.location.href = 'vip-gold.html';
                    } else if (targetLevel === '铂金会员') {
                        window.location.href = 'vip-platinum.html';
                    } else {
                        window.location.href = 'shop.html';
                    }
                } else {
                    showToast('升级失败：' + result.msg);
                }
            } catch (e) {
                console.error(e);
                showToast("网络异常，请重试");
            }
        }

        // ========== 登录弹窗全套方法（和shop.html统一） ==========
        function openLoginModal() {
            const modal = document.getElementById('loginModal');
            const content = document.getElementById('loginModalContent');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
            setTimeout(() => {
                content.classList.remove('scale-95', 'opacity-0');
                content.classList.add('scale-100', 'opacity-100');
            }, 10);
        }
        function closeLoginModal() {
            const modal = document.getElementById('loginModal');
            const content = document.getElementById('loginModalContent');
            content.classList.remove('scale-100', 'opacity-100');
            content.classList.add('scale-95', 'opacity-0');
            setTimeout(() => {
                modal.classList.add('hidden');
                modal.classList.remove('flex');
            }, 300);
        }
        function switchTab(type) {
            const tabLogin = document.getElementById('tabLogin');
            const tabRegister = document.getElementById('tabRegister');
            const formLogin = document.getElementById('formLogin');
            const formRegister = document.getElementById('formRegister');
            if (type === 'login') {
                tabLogin.className = 'text-lg font-bold text-gray-900 border-b-2 border-rose-500 pb-2';
                tabRegister.className = 'text-lg font-medium text-gray-400 pb-2 hover:text-gray-600 transition';
                formLogin.classList.remove('hidden');
                formRegister.classList.add('hidden');
            } else {
                tabRegister.className = 'text-lg font-bold text-gray-900 border-b-2 border-rose-500 pb-2';
                tabLogin.className = 'text-lg font-medium text-gray-400 pb-2 hover:text-gray-600 transition';
                formRegister.classList.remove('hidden');
                formLogin.classList.add('hidden');
            }
        }
        async function handleLogin(e) {
            e.preventDefault();
            const phone = document.getElementById('loginPhone').value.trim();
            const password = document.getElementById('loginPassword').value.trim();
            try {
                const res = await fetch('https://api.zhuys.dpdns.org/api/members/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ phone: phone, password: password })
                });
                const result = await res.json();
                if (result.code === 200) {
                    localStorage.setItem('shopUser', JSON.stringify(result.data));
                    showToast('欢迎回来，' + result.data.memberName);
                    closeLoginModal();
                    updateUserAvatar();
                } else {
                    showToast(result.msg || '登录失败');
                }
            } catch (e) { showToast('网络异常，请稍后再试'); }
        }
        async function handleRegister(e) {
            e.preventDefault();
            const name = document.getElementById('regName').value.trim();
            const phone = document.getElementById('regPhone').value.trim();
            const password = document.getElementById('regPassword').value.trim();
            try {
                const res = await fetch('https://api.zhuys.dpdns.org/api/members/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ memberName: name, phone: phone, password: password })
                });
                const result = await res.json();
                if (result.code === 200) {
                    localStorage.setItem('shopUser', JSON.stringify(result.data));
                    showToast('注册成功，已自动登录');
                    closeLoginModal();
                    updateUserAvatar();
                } else {
                    showToast(result.msg || '注册失败');
                }
            } catch (e) { showToast('网络异常，请稍后再试'); }
        }
        function logoutUser() {
            if (confirm('确定要退出登录吗？')) {
                localStorage.removeItem('shopUser');
                location.reload();
            }
        }
        // 点击空白关闭下拉菜单
        document.addEventListener('click', ()=>{
            const userMenu = document.getElementById('userMenu');
            if(userMenu) userMenu.classList.add('hidden');
        })
        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.classList.remove('-translate-y-10', 'opacity-0');
            setTimeout(() => { toast.classList.add('-translate-y-10', 'opacity-0'); }, 2000);
        }
    </script>
</body>
</html>
