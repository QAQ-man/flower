<!DOCTYPE html>
<html class="w-full h-full" lang="zh-CN">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>商品详情 · FLOWERPLUS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <style>
        .serif { font-family: "Songti SC", "Noto Serif SC", Georgia, serif; }
        body { background-color: #faf9f6; }
    </style>
</head>
<body class="w-full min-h-screen text-gray-800 antialiased">

    <!-- 简易导航 -->
    <header class="sticky top-0 z-50 bg-white/90 backdrop-blur-md shadow-sm border-b border-gray-100">
        <div class="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between">
            <a href="shop.html" class="flex items-center gap-2 text-gray-500 hover:text-rose-500 transition">
                <iconify-icon class="text-[20px]" icon="solar:alt-arrow-left-linear"></iconify-icon>
                <span class="font-medium">返回商城</span>
            </a>
            <span class="serif text-xl font-bold tracking-widest text-gray-900">FLOWERPLUS</span>
            <div class="w-20"></div> <!-- 占位保持居中 -->
        </div>
    </header>

    <!-- 商品详情主体 -->
    <main class="max-w-6xl mx-auto px-4 py-10">
        <div id="loading" class="text-center py-20 text-gray-400">正在加载商品详情...</div>

        <!-- 动态渲染区域 -->
        <div id="detailContent" class="hidden grid grid-cols-1 md:grid-cols-2 gap-12">
            
            <!-- 左侧：商品大图 -->
            <div class="space-y-4">
                <div class="w-full aspect-square rounded-3xl overflow-hidden bg-white shadow-sm border border-gray-100">
                    <img id="detailImage" src="" alt="商品图" class="w-full h-full object-cover"/>
                </div>
            </div>

            <!-- 右侧：商品信息 -->
            <div class="flex flex-col justify-start">
                <h1 id="detailName" class="serif text-3xl font-bold text-gray-900 mb-2">加载中...</h1>
                <p id="detailSku" class="text-sm text-gray-400 mb-4">SKU: --</p>
                
                <div class="bg-rose-50 rounded-2xl p-6 mb-6">
                    <p class="text-sm text-gray-500 mb-1">售价</p>
                    <p class="text-4xl font-bold text-rose-600"><span class="text-xl">￥</span><span id="detailPrice">0.00</span></p>
                </div>

                <div class="space-y-4 mb-8">
                    <div class="flex items-center gap-2 text-sm text-gray-600">
                        <iconify-icon class="text-emerald-500 text-lg" icon="solar:check-circle-bold"></iconify-icon> 产地直采 · 保证新鲜
                    </div>
                    <div class="flex items-center gap-2 text-sm text-gray-600">
                        <iconify-icon class="text-emerald-500 text-lg" icon="solar:delivery-bold"></iconify-icon> 顺丰冷链 · 同城 3 小时达
                    </div>
                    <p class="text-sm text-gray-500 leading-relaxed pt-2 border-t border-gray-100">
                        <span class="font-bold text-gray-700">商品描述：</span>
                        <span id="detailDesc">暂无描述</span>
                    </p>
                </div>

                <!-- 购买操作 -->
                <div class="mt-auto flex gap-4">
                    <div class="flex items-center border border-gray-200 rounded-xl bg-white">
                        <button onclick="changeQty(-1)" class="w-10 h-12 text-gray-500 hover:text-rose-500">-</button>
                        <span id="buyQty" class="w-10 text-center font-bold">1</span>
                        <button onclick="changeQty(1)" class="w-10 h-12 text-gray-500 hover:text-rose-500">+</button>
                    </div>
                    <button onclick="addToCart()" class="flex-1 h-12 bg-gray-900 text-white rounded-xl font-bold hover:bg-gray-800 transition shadow-lg shadow-gray-900/20">
                        加入购物车
                    </button>
                    <button onclick="buyNow()" class="flex-1 h-12 bg-rose-500 text-white rounded-xl font-bold hover:bg-rose-600 transition shadow-lg shadow-rose-500/30">
                        立即购买
                    </button>
                </div>
            </div>
        </div>
    </main>

    <!-- 底部：花材构成详情 -->
    <section class="max-w-6xl mx-auto px-4 py-10 border-t border-gray-200">
        <h2 class="serif text-2xl font-bold text-gray-900 mb-6">花材构成与养护</h2>
        <div class="bg-white rounded-3xl p-8 shadow-sm border border-gray-100 text-gray-600 leading-relaxed text-sm">
            <div id="detailFlowerItems" class="space-y-2">正在加载花材构成...</div>
            
            <div class="mt-6 p-4 bg-gray-50 rounded-xl">
                <p class="font-bold text-gray-800 mb-2">养护指南：</p>
                <ul class="list-disc pl-5 space-y-1">
                    <li>收到鲜花后，请及时拆除包装。</li>
                    <li>斜剪根部 2-3 厘米，放入花瓶。</li>
                    <li>建议每天换水，并保持通风。</li>
                </ul>
            </div>
        </div>
    </section>

    <script>
        let productData = null;
        let quantity = 1;

        // 1. 页面加载时获取 URL 中的 ID
        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const id = urlParams.get('id');
            
            if (!id) {
                alert('缺少商品ID');
                window.location.href = 'shop.html';
                return;
            }
            fetchProductDetail(id);
        });

        // 2. 请求后端接口获取详情
        async function fetchProductDetail(id) {
            try {
                // 完美对接您的 GoodsController 中的 @GetMapping("/{id}")
                const res = await fetch(`http://localhost:8080/api/goods/${id}`);
                const result = await res.json();

                if (result.code === 200 && result.data) {
                    productData = result.data;
                    renderDetail(productData);
                } else {
                    alert('商品不存在或已下架');
                    window.location.href = 'shop.html';
                }
            } catch (e) {
                console.error('获取详情失败', e);
                document.getElementById('loading').textContent = '网络异常，加载失败';
            }
        }

        // 3. 渲染数据到页面
        function renderDetail(data) {
            document.getElementById('loading').classList.add('hidden');
            document.getElementById('detailContent').classList.remove('hidden');

            // 基本信息
            document.getElementById('detailName').textContent = data.goodsName || '未知商品';
            document.getElementById('detailSku').textContent = 'SKU: ' + (data.sku || '--');
            document.getElementById('detailPrice').textContent = Number(data.price || 0).toFixed(2);
            document.getElementById('detailDesc').textContent = data.descShort || data.description || '精选优质鲜花，为您带来好心情。';
            
            // 图片
            const defaultImg = 'https://images.unsplash.com/photo-1563241527-3004b7be0ffd?w=800&q=80';
            const imgUrl = data.imageMain || defaultImg;
            document.getElementById('detailImage').src = imgUrl;

            // 渲染花材构成 (匹配后端返回的 flowers 数组)
            const flowerBox = document.getElementById('detailFlowerItems');
            if (data.flowers && data.flowers.length > 0) {
                flowerBox.innerHTML = data.flowers.map(item => 
                    `<p class="flex items-center gap-2">
                        <span class="w-1.5 h-1.5 rounded-full bg-rose-500"></span>
                        <span class="font-bold text-gray-800">${item.flowerName}</span> 
                        <span class="text-gray-500">— ${item.amount}</span>
                        ${item.origin ? `<span class="text-xs text-gray-400 ml-2">(${item.origin})</span>` : ''}
                    </p>`
                ).join('');
            } else {
                flowerBox.textContent = '本商品由当季精选花材组成，请以实物为准。';
            }
        }

        // 4. 数量加减
        function changeQty(delta) {
            quantity += delta;
            if (quantity < 1) quantity = 1;
            document.getElementById('buyQty').textContent = quantity;
        }

        // 5. 加入购物车逻辑
        function addToCart() {
            if (!productData) return;
            
            // 使用 localStorage 进行跨页面购物车同步
            let cart = JSON.parse(localStorage.getItem('shopCart') || '[]');
            
            const existingIndex = cart.findIndex(item => item.id === productData.id);
            if (existingIndex > -1) {
                cart[existingIndex].qty += quantity;
            } else {
                cart.push({ ...productData, qty: quantity });
            }
            
            localStorage.setItem('shopCart', JSON.stringify(cart));
            alert(`已将 ${quantity} 件「${productData.goodsName}」加入购物车`);
            window.location.href = 'shop.html'; // 返回商城首页
        }

                // 6. 立即购买逻辑
        function buyNow() {
            if (!productData) return;
            
            // 1. 将当前商品打包成购物车格式，并存入 localStorage
            const directBuyItem = { ...productData, qty: quantity };
            localStorage.setItem('directBuy', JSON.stringify([directBuyItem]));
            
            // 2. 标记本次是“立即购买”模式，方便商城页识别
            localStorage.setItem('isDirectBuy', 'true');
            
            // 3. 直接带着参数跳回商城首页（打开购物车抽屉自动结算）
            window.location.href = 'shop.html?action=checkout';
        }
    </script>
</body>
</html>
