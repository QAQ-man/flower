<!DOCTYPE html>
<html class="w-full h-full" lang="zh-CN">

<body class="flex items-center justify-center h-screen">

    <div class="text-center p-8 bg-white rounded-3xl shadow-sm border border-gray-100 max-w-md w-full mx-4">
