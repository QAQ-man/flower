<!DOCTYPE html>
<html class="w-full h-full" lang="zh-CN">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1" name="viewport"/>
    <title>我的订单 · 花加 FLOWERPLUS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <style>
        .serif { font-family: "Songti SC", "Noto Serif SC", Georgia, serif; }
        body { background-color: #faf9f6; }
        ::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="w-full min-h-screen text-gray-800 antialiased">

    <!-- 顶部导航栏 -->
    <header class="sticky top-0 z-50 bg-white/90 backdrop-blur-md shadow-sm border-b border-gray-100">
        <div class="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between">
            <a href="shop.html" class="flex items-center gap-2">
                <span class="w-8 h-8 rounded-full bg-rose-500 flex items-center justify-center text-white">
                    <iconify-icon class="text-[18px]" icon="solar:flower-2-bold"></iconify-icon>
                </span>
                <span class="serif text-xl font-bold tracking-widest text-gray-900">FLOWERPLUS</span>
            </a>
            
            <nav class="hidden md:flex items-center gap-8 text-sm font-medium text-gray-600">
                <a href="shop.html" class="hover:text-rose-500 transition">首页</a>
                <!-- ⭐ 修改：会员智能跳转 -->
                <a href="javascript:void(0)" onclick="goToMemberCenter()" class="hover:text-rose-500 transition">会员订阅</a>
                <a href="gifts.html" class="hover:text-rose-500 transition">节日礼盒</a>
                <a href="about.html" class="hover:text-rose-500 transition">关于我们</a>
            </nav>

            <div class="flex items-center gap-5">
                <a href="shop.html" class="text-gray-600 hover:text-rose-500 transition relative">
                    <iconify-icon class="text-[22px]" icon="solar:cart-large-2-linear"></iconify-icon>
                </a>

                <div class="relative group py-4">
                    <button id="userBtn" class="text-gray-600 hover:text-rose-500 transition flex items-center">
                        <iconify-icon class="text-[22px]" icon="solar:user-circle-linear"></iconify-icon>
                    </button>
                    <div class="absolute right-0 mt-1 w-48 bg-white rounded-2xl shadow-xl border border-gray-100 opacity-0 invisible group-hover:opacity-100 group-hover:visible transition-all duration-200 transform translate-y-2 group-hover:translate-y-0 z-50">
                        <div class="absolute -top-2 right-3 w-4 h-4 bg-white border-t border-l border-gray-100 transform rotate-45"></div>
                        <div class="py-2 relative bg-white rounded-2xl">
							<a href="profile.html" class="flex items-center gap-3 px-4 py-2.5 text-sm text-gray-600 hover:bg-rose-50 hover:text-rose-600 transition">
                                <iconify-icon class="text-[18px]" icon="solar:user-id-linear"></iconify-icon> 个人中心
                            </a>
                            <a href="my-orders.html" class="flex items-center gap-3 px-4 py-2.5 text-sm text-rose-600 font-medium transition">
                                <iconify-icon class="text-[18px]" icon="solar:bill-list-linear"></iconify-icon> 我的订单
                            </a>
                            <a href="#" onclick="logoutUser()" class="flex items-center gap-3 px-4 py-2.5 text-sm text-gray-600 hover:bg-rose-50 hover:text-rose-600 transition">
                                <iconify-icon class="text-[18px]" icon="solar:logout-3-linear"></iconify-icon> 退出登录
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <!-- 订单列表区 -->
    <section class="max-w-4xl mx-auto px-4 py-12">
        <h1 class="serif text-3xl font-bold text-gray-900 mb-8">我的订单</h1>
        
        <div class="space-y-6" id="orderList">
            <div class="text-center py-20 text-gray-400">正在加载订单...</div>
        </div>
    </section>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            updateUserAvatar();
            fetchMyOrders();
        });

        // ⭐ 会员智能跳转
        function goToMemberCenter() {
            const userStr = localStorage.getItem('shopUser');
            if (!userStr) {
                window.location.href = 'subscribe.html';
                return;
            }

            const user = JSON.parse(userStr);
            const level = user.memberLevel || '普通用户';

            if (level === '铂金会员') {
                window.location.href = 'vip-platinum.html';
            } else if (level === '金卡会员') {
                window.location.href = 'vip-gold.html';
            } else if (level === '普通会员') {
                window.location.href = 'vip-normal.html';
            } else {
                window.location.href = 'subscribe.html';
            }
        }

                function updateUserAvatar() {
                    const userStr = localStorage.getItem('shopUser');
                    const userBtn = document.getElementById('userBtn');
                    
                    if (userStr && userBtn) {
                        const user = JSON.parse(userStr);
                        // 👇 修改这里：如果有 avatar 字段则用图片，没有则用默认首字母
                        if (user.avatar && user.avatar.trim() !== '') {
                            userBtn.innerHTML = `
                                <img src="${user.avatar}" alt="头像" class="w-8 h-8 rounded-full object-cover border border-gray-200"/>
                            `;
                        } else {
                            userBtn.innerHTML = `
                                <div class="w-8 h-8 rounded-full bg-rose-500 text-white flex items-center justify-center text-sm font-bold">
                                    ${user.memberName ? user.memberName.charAt(0).toUpperCase() : '花'}
                                </div>
                            `;
                        }
                        
                        // 点击头像去个人中心
                        userBtn.onclick = function() {
                            window.location.href = 'profile.html';
                        };
                    } else if (userBtn) {
                        // 如果没登录，点击头像去首页或弹出登录框
                        userBtn.onclick = function() {
                            window.location.href = 'shop.html';
                        };
                    }
                }

        function logoutUser() {
            if (confirm('确定要退出登录吗？')) {
                localStorage.removeItem('shopUser');
                location.reload();
            }
        }

        async function fetchMyOrders() {
            const userStr = localStorage.getItem('shopUser');
            if (!userStr) {
                document.getElementById('orderList').innerHTML = `
                    <div class="text-center py-20">
                        <p class="text-gray-500 mb-4">您还未登录，请先登录查看订单</p>
                        <a href="shop.html" class="px-6 py-2 bg-rose-500 text-white rounded-lg">去登录</a>
                    </div>
                `;
                return;
            }

            const user = JSON.parse(userStr);
            const memberId = user.id || 0;
            const phone = user.phone || '';

            try {
                const res = await fetch(`https://api.zhuys.dpdns.org/api/orders/myList?memberId=${memberId}&phone=${phone}`);
                const result = await res.json();

                if (result.code === 200 && result.data) {
                    renderOrders(result.data);
                } else {
                    document.getElementById('orderList').innerHTML = `<div class="text-center py-10 text-red-400">${result.msg || '加载订单失败'}</div>`;
                }
            } catch (e) {
                document.getElementById('orderList').innerHTML = `<div class="text-center py-10 text-red-400">网络异常，请稍后再试</div>`;
            }
        }

        function renderOrders(orders) {
            const container = document.getElementById('orderList');
            
            if (orders.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-20">
                        <p class="text-gray-400 mb-4">您还没有下过订单哦~</p>
                        <a href="shop.html" class="px-6 py-2 bg-rose-500 text-white rounded-lg shadow hover:bg-rose-600 transition">去逛逛</a>
                    </div>
                `;
                return;
            }

            const statusMap = {
                'pending': { text: '待配花', cls: 'text-amber-500 bg-amber-50' },
                'paid': { text: '已支付', cls: 'text-blue-500 bg-blue-50' },
                'finished': { text: '已完成', cls: 'text-emerald-500 bg-emerald-50' },
                'aftersale': { text: '售后处理', cls: 'text-rose-500 bg-rose-50' }
            };

            container.innerHTML = orders.map(o => {
                const st = statusMap[o.status] || { text: o.status, cls: 'text-gray-500 bg-gray-50' };
                const dateStr = o.createdAt ? o.createdAt.substring(0, 16) : '';

                return `
                    <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-6 hover:shadow-md transition cursor-pointer" onclick="window.location.href='success.html?id=${o.id}'">
                        <div class="flex items-center justify-between border-b border-gray-50 pb-4 mb-4">
                            <div class="flex items-center gap-4 text-sm text-gray-500">
                                <span>订单号：<span class="text-gray-900 font-mono">${o.orderNo}</span></span>
                                <span>${dateStr}</span>
                            </div>
                            <span class="px-3 py-1 rounded-full text-xs font-bold ${st.cls}">${st.text}</span>
                        </div>
                        <div class="flex items-center justify-between">
                            <div class="flex items-center gap-4">
                                <div>
                                    <h3 class="text-gray-900 font-bold mb-1">${o.receiverName}</h3>
                                    <p class="text-sm text-gray-500 line-clamp-1">${o.receiverAddress}</p>
                                </div>
                            </div>
                            <div class="text-right">
                                <p class="text-sm text-gray-500 mb-1">实付金额</p>
                                <p class="text-xl font-bold text-rose-600"><span class="text-sm">￥</span>${o.realPay}</p>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }
    </script>
</body>
</html>
